name: Atualizar dados do dashboard (semanal)

on:
  schedule:
    - cron: "0 8 * * 1"   # toda segunda-feira, 8h UTC (5h BRT)
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar dados
        env:
          AIRBYTE_URL: ${{ secrets.AIRBYTE_URL }}
          AIRBYTE_CLIENT_ID: ${{ secrets.AIRBYTE_CLIENT_ID }}
          AIRBYTE_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OM_URL: ${{ secrets.OM_URL }}
          OM_TOKEN: ${{ secrets.OM_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        # airbyte/airflow ficaram de fora daqui - agora atualizam a cada 2h via
        # update-data-airflow-airbyte.yml, esse job semanal so cobre o resto.
        run: python3 fetch_dashboard_data.py --only snowflake,om

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "Sem mudanças, nada a commitar."
            exit 0
          fi
          git commit -m "Atualiza dados semanais do dashboard [skip ci]"
          git pull --rebase
          git push
