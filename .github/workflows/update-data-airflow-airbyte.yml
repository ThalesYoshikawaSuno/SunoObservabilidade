name: Atualizar status Airflow/Airbyte (a cada hora)

on:
  schedule:
    # De hora em hora, 24h/dia (sem restringir 9h-23h UTC) - teste pra ver se
    # o range de horas ("9-23") era parte do motivo do agendador do GitHub
    # nao disparar direito (0/15 horarios batidos no dia 27/ago inteiro,
    # mesmo depois de já ter mudado o minuto de 0 pra 17). Minuto 17 mantido
    # (evita o pico global de schedules no minuto 0). Se isso nao resolver,
    # a saida e um cron externo (no nosso servidor) chamando a API de
    # dispatch do GitHub, que nao depende do agendador interno deles.
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar status (Airbyte + Airflow + saúde das ingestões nativas do OM)
        env:
          AIRBYTE_URL: ${{ secrets.AIRBYTE_URL }}
          AIRBYTE_CLIENT_ID: ${{ secrets.AIRBYTE_CLIENT_ID }}
          AIRBYTE_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OM_URL: ${{ secrets.OM_URL }}
          OM_TOKEN: ${{ secrets.OM_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          # Opcionais - se nao configurados nos Secrets do repo, o script pula
          # a notificacao/reconciliacao correspondente sem quebrar a run.
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          SLACK_USER_EMAIL: ${{ secrets.SLACK_USER_EMAIL }}
          AIRFLOW_API_URL: ${{ secrets.AIRFLOW_API_URL }}
          AIRFLOW_API_USER: ${{ secrets.AIRFLOW_API_USER }}
          AIRFLOW_API_PASS: ${{ secrets.AIRFLOW_API_PASS }}
          CF_ACCESS_AIRFLOW_CLIENT_ID: ${{ secrets.CF_ACCESS_AIRFLOW_CLIENT_ID }}
          CF_ACCESS_AIRFLOW_CLIENT_SECRET: ${{ secrets.CF_ACCESS_AIRFLOW_CLIENT_SECRET }}
        run: python3 fetch_dashboard_data.py --only airbyte,airflow_status,ingestion_status,reconcile

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airbyte.csv data/airflow.csv data/om_ingestion_status.csv \
                  data/history_airbyte.csv data/history_airflow.csv data/history_ingestion_status.csv \
                  data/reconcile_alerted.csv data/failure_alerted.csv data/_meta.csv
          if git diff --staged --quiet; then
            echo "Sem mudanças, nada a commitar."
            exit 0
          fi
          git commit -m "Atualiza status de Airflow/Airbyte [skip ci]"
          # Esses CSVs sao reescritos por inteiro a cada run (nao e append) -
          # se outro workflow (ou essa mesma run disparada em paralelo) commitou
          # entre o checkout e agora, um "git pull --rebase" comum da conflito
          # de texto linha a linha, porque as duas versoes divergem quase
          # inteiras. Como o conteudo e 100% gerado (nunca editado a mao), o
          # snapshot mais recente sempre pode vencer sem perda real - por isso
          # "-X ours" no rebase (mantem nosso commit recem-gerado em caso de
          # conflito) com retry, em vez de exigir merge manual.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push ok na tentativa $i."
              exit 0
            fi
            echo "Push falhou (tentativa $i), buscando atualizacoes e tentando de novo..."
            git fetch origin main
            git rebase -X ours origin/main
            sleep $(( (RANDOM % 8) + 2 ))
          done
          echo "Nao foi possivel commitar apos 5 tentativas."
          exit 1
