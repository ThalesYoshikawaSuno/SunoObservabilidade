name: Atualizar Airflow/Airbyte (a cada 2h, 6h-20h BRT)

on:
  schedule:
    # 6,8,10,12,14,16,18,20h BRT = 9,11,13,15,17,19,21,23h UTC (BRT = UTC-3)
    - cron: "0 9,11,13,15,17,19,21,23 * * *"
  workflow_dispatch: {}

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar dados (Airbyte + Airflow)
        env:
          AIRBYTE_URL: ${{ secrets.AIRBYTE_URL }}
          AIRBYTE_CLIENT_ID: ${{ secrets.AIRBYTE_CLIENT_ID }}
          AIRBYTE_CLIENT_SECRET: ${{ secrets.AIRBYTE_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OM_URL: ${{ secrets.OM_URL }}
          OM_TOKEN: ${{ secrets.OM_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python3 fetch_dashboard_data.py --only airbyte,airflow

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/airbyte.csv data/airflow.csv data/_meta.csv
          git diff --staged --quiet || git commit -m "Atualiza dados de Airflow/Airbyte [skip ci]"
          git push
